name: Build Desktop (macOS / Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- macOS
  build-macos:
    name: Build macOS .dmg
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build NexusDeck.app
        run: |
          pyinstaller build.spec --noconfirm --clean
          test -d dist/NexusDeck.app && echo "app built"

      - name: Create macOS DMG
        run: |
          mkdir -p dist/dmg-stage
          cp -R dist/NexusDeck.app dist/dmg-stage/
          ln -s /Applications dist/dmg-stage/Applications
          hdiutil create -volname "NexusDeck" \
            -srcfolder dist/dmg-stage \
            -ov -format UDZO dist/NexusDeck-macos.dmg
          test -f dist/NexusDeck-macos.dmg && echo "dmg built"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusdeck-macos
          path: dist/NexusDeck-macos.dmg

  # ---------------------------------------------------------------- Windows
  build-windows:
    name: Build Windows .exe
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build NexusDeck.exe
        run: |
          pyinstaller --onefile --windowed --name NexusDeck `
            --add-data "static;static" --add-data "VERSION;." `
            --hidden-import msvcrt server.py
          if (!(Test-Path dist/NexusDeck.exe)) { throw "exe not built" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusdeck-windows
          path: dist/NexusDeck.exe

  # ---------------------------------------------------------------- Release
  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            [ -z "$VERSION" ] && VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage assets
        run: |
          mkdir -p release
          cp artifacts/nexusdeck-macos/NexusDeck-macos.dmg release/
          cp artifacts/nexusdeck-windows/NexusDeck.exe release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version && format('v{0}', steps.ver.outputs.version) || 'v1.0.0' }}
          name: 枢纽台 NexusDeck v${{ steps.ver.outputs.version }}
          body: |
            ## 枢纽台 NexusDeck v${{ steps.ver.outputs.version }}

            本地服务指挥台桌面版，零依赖 Python 后端 + 原生前端，跨平台运行。

            ### 下载
            - **macOS**：`NexusDeck-macos.dmg` → 双击挂载，将 `NexusDeck.app` 拖入「应用程序」（仅回环地址）
            - **Windows**：`NexusDeck.exe`（双击运行，数据存于 `%LOCALAPPDATA%\枢纽台`）

            ### 说明
            - 仅绑定 127.0.0.1，不会对外暴露；请只添加信任的命令。
            - macOS 首次打开若提示已损坏，执行：
              `xattr -dr com.apple.quarantine /Applications/NexusDeck.app`
          files: |
            release/NexusDeck-macos.zip
            release/NexusDeck.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
